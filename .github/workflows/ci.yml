name: SEAL-RV RTL CI

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys verilator make

      - name: Install Cocotb
        run: python3 -m pip install cocotb==2.1.0

      - name: Run counter and CPU simulations
        run: make sim

      - name: Run Cocotb CPU tests
        run: make test-cocotb

      - name: Run RTL lint
        run: make lint

      - name: Run synthesis smoke tests
        run: make synth
